  <path d="M590 220 L615 170 L640 220 Z" fill="rgba(210,255,116,0.2)" stroke="#D2FF74" stroke-width="2"/>
  <text x="540" y="300" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="14">Ergonomic Mouse</text>
  <text x="540" y="322" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12">26k DPI Wireless</text>
