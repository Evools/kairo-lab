  <rect x="365" y="170" width="70" height="70" rx="12" fill="rgba(210,255,116,0.12)" stroke="#D2FF74"/>
  <text x="325" y="300" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="14">Modular Keychron</text>
  <text x="325" y="322" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12">Hot-swap Gateron</text>
