  <text x="110" y="300" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="14">Cyber Audio Headset</text>
  <text x="110" y="322" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12">Spatial 3D Sound</text>
