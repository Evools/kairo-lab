<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#141418"/>
  <!-- Top bar -->
  <rect x="0" y="0" width="800" height="44" fill="#18181D" border-bottom="1px solid #27272A"/>
  <circle cx="32" cy="22" r="5" fill="#FF5F56"/>
  <circle cx="48" cy="22" r="5" fill="#FFBD2E"/>
  <circle cx="64" cy="22" r="5" fill="#27C93F"/>
  <rect x="100" y="14" width="240" height="16" rx="8" fill="#222228"/>
  <rect x="720" y="12" width="50" height="20" rx="6" fill="#D2FF74"/>

  <!-- Left Sidebar -->
  <rect x="0" y="44" width="70" height="406" fill="#16161B"/>
  <rect x="20" y="68" width="30" height="30" rx="8" fill="rgba(210, 255, 116, 0.15)"/>
  <rect x="20" y="118" width="30" height="30" rx="8" fill="#222228"/>
  <rect x="20" y="168" width="30" height="30" rx="8" fill="#222228"/>
  <rect x="20" y="218" width="30" height="30" rx="8" fill="#222228"/>

  <!-- Main Canvas -->
  <text x="100" y="90" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="18">Liquidity &amp; Asset Dynamics</text>
  <text x="100" y="112" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="12">Real-time market analytics dashboard</text>

  <!-- Metric Card 1 -->
  <rect x="100" y="134" width="190" height="96" rx="12" fill="#1A1A20" stroke="rgba(255,255,255,0.08)"/>
  <text x="120" y="164" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">TOTAL BALANCE</text>
  <text x="120" y="196" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="22">$284,910.45</text>
  <rect x="220" y="152" width="50" height="18" rx="9" fill="rgba(210, 255, 116, 0.15)"/>
  <text x="230" y="165" fill="#D2FF74" font-family="sans-serif" font-weight="600" font-size="10">+14.2%</text>

  <!-- Metric Card 2 -->
  <rect x="310" y="134" width="190" height="96" rx="12" fill="#1A1A20" stroke="rgba(255,255,255,0.08)"/>
  <text x="330" y="164" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">MONTHLY REVENUE</text>
  <text x="330" y="196" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="22">$42,380.00</text>
  <rect x="430" y="152" width="50" height="18" rx="9" fill="rgba(210, 255, 116, 0.15)"/>
  <text x="440" y="165" fill="#D2FF74" font-family="sans-serif" font-weight="600" font-size="10">+8.6%</text>

  <!-- Metric Card 3 -->
  <rect x="520" y="134" width="240" height="96" rx="12" fill="#1A1A20" stroke="rgba(255,255,255,0.08)"/>
  <text x="540" y="164" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">ACTIVE USERS</text>
  <text x="540" y="196" fill="#D2FF74" font-family="sans-serif" font-weight="700" font-size="22">18,429</text>

  <!-- Large Graph Canvas -->
  <rect x="100" y="250" width="660" height="170" rx="14" fill="#1A1A20" stroke="rgba(255,255,255,0.08)"/>
  <path d="M120 370 C 180 320, 240 380, 320 310 C 400 240, 480 330, 560 280 C 640 230, 700 270, 740 260" stroke="#D2FF74" stroke-width="3" fill="none"/>
  <path d="M120 370 C 180 320, 240 380, 320 310 C 400 240, 480 330, 560 280 C 640 230, 700 270, 740 260 L740 400 L120 400 Z" fill="url(#limeGradient)" opacity="0.15"/>
  <circle cx="560" cy="280" r="5" fill="#D2FF74" stroke="#121215" stroke-width="2"/>
  <defs>
    <linearGradient id="limeGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D2FF74"/>
      <stop offset="100%" stop-color="#D2FF74" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
