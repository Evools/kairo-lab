  <text x="312" y="261" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="13">✉</text>
  <text x="310" y="296" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="14">Экспертиза &amp; Сертификаты</text>
