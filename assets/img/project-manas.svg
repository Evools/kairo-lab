<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0D1117"/>
  <!-- Top header -->
  <rect x="0" y="0" width="800" height="52" fill="#161B22"/>
  <circle cx="32" cy="26" r="5" fill="#FF5F56"/>
  <circle cx="48" cy="26" r="5" fill="#FFBD2E"/>
  <circle cx="64" cy="26" r="5" fill="#27C93F"/>
  <text x="96" y="32" fill="#FFFFFF" font-family="'Unbounded', sans-serif" font-weight="700" font-size="14">MANAS AIRPORT PORTAL</text>
  <rect x="670" y="16" width="94" height="20" rx="10" fill="rgba(210, 255, 116, 0.15)"/>
  <text x="682" y="30" fill="#D2FF74" font-family="sans-serif" font-weight="600" font-size="10">LIVE STATUS</text>

  <!-- Navigation tab line -->
  <rect x="40" y="74" width="120" height="28" rx="6" fill="#21262D"/>
  <text x="56" y="92" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="12">Табло рейсов</text>
  <rect x="170" y="74" width="100" height="28" rx="6" fill="transparent"/>
  <text x="186" y="92" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="12">Пассажирам</text>
  <rect x="280" y="74" width="90" height="28" rx="6" fill="transparent"/>
  <text x="296" y="92" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="12">Услуги</text>

  <!-- Flight Status Board Table -->
  <rect x="40" y="120" width="720" height="290" rx="12" fill="#161B22" stroke="rgba(255,255,255,0.08)"/>
  
  <!-- Table Header -->
  <rect x="40" y="120" width="720" height="40" rx="12" fill="#1F242C"/>
  <text x="64" y="145" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-weight="600" font-size="11">РЕЙС</text>
  <text x="180" y="145" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-weight="600" font-size="11">НАПРАВЛЕНИЕ</text>
  <text x="360" y="145" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-weight="600" font-size="11">ВРЕМЯ</text>
  <text x="480" y="145" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-weight="600" font-size="11">СЕКТОР</text>
  <text x="600" y="145" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-weight="600" font-size="11">СТАТУС</text>

  <!-- Row 1 -->
  <line x1="40" y1="160" x2="760" y2="160" stroke="rgba(255,255,255,0.05)"/>
  <text x="64" y="190" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="13">TK 345</text>
  <text x="180" y="190" fill="#FFFFFF" font-family="sans-serif" font-weight="500" font-size="13">Стамбул (IST)</text>
  <text x="360" y="190" fill="rgba(255,255,255,0.8)" font-family="sans-serif" font-size="13">10:45</text>
  <text x="480" y="190" fill="rgba(255,255,255,0.8)" font-family="sans-serif" font-size="13">Gate A-02</text>
  <rect x="600" y="174" width="90" height="22" rx="11" fill="rgba(210, 255, 116, 0.15)"/>
  <text x="614" y="189" fill="#D2FF74" font-family="sans-serif" font-weight="600" font-size="10">ПОСАДКА</text>

  <!-- Row 2 -->
  <line x1="40" y1="212" x2="760" y2="212" stroke="rgba(255,255,255,0.05)"/>
  <text x="64" y="242" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="13">SU 1883</text>
  <text x="180" y="242" fill="#FFFFFF" font-family="sans-serif" font-weight="500" font-size="13">Москва (SVO)</text>
  <text x="360" y="242" fill="rgba(255,255,255,0.8)" font-family="sans-serif" font-size="13">11:20</text>
  <text x="480" y="242" fill="rgba(255,255,255,0.8)" font-family="sans-serif" font-size="13">Gate B-05</text>
  <rect x="600" y="226" width="90" height="22" rx="11" fill="rgba(255, 255, 255, 0.08)"/>
  <text x="612" y="241" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="10">РЕГИСТРАЦИЯ</text>

  <!-- Row 3 -->
  <line x1="40" y1="264" x2="760" y2="264" stroke="rgba(255,255,255,0.05)"/>
  <text x="64" y="294" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="13">FZ 1690</text>
  <text x="180" y="294" fill="#FFFFFF" font-family="sans-serif" font-weight="500" font-size="13">Дубай (DXB)</text>
  <text x="360" y="294" fill="rgba(255,255,255,0.8)" font-family="sans-serif" font-size="13">12:15</text>
  <text x="480" y="294" fill="rgba(255,255,255,0.8)" font-family="sans-serif" font-size="13">Gate A-04</text>
  <rect x="600" y="278" width="90" height="22" rx="11" fill="rgba(255, 255, 255, 0.08)"/>
  <text x="622" y="293" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="10">ПО ПЛАНУ</text>

  <!-- Row 4 -->
  <line x1="40" y1="316" x2="760" y2="316" stroke="rgba(255,255,255,0.05)"/>
  <text x="64" y="346" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="13">CZ 6006</text>
  <text x="180" y="346" fill="#FFFFFF" font-family="sans-serif" font-weight="500" font-size="13">Урумчи (URC)</text>
  <text x="360" y="346" fill="rgba(255,255,255,0.8)" font-family="sans-serif" font-size="13">13:30</text>
  <text x="480" y="346" fill="rgba(255,255,255,0.8)" font-family="sans-serif" font-size="13">Gate B-01</text>
  <rect x="600" y="330" width="90" height="22" rx="11" fill="rgba(255, 255, 255, 0.08)"/>
  <text x="622" y="345" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="10">ПО ПЛАНУ</text>

  <!-- Footer status bar -->
  <line x1="40" y1="368" x2="760" y2="368" stroke="rgba(255,255,255,0.05)"/>
  <text x="64" y="392" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="11">Международный аэропорт «Манас» • Автоматическое обновление данных • FRU/UCFM</text>
</svg>
